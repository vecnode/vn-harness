# dsh-diagrams bundle layer (alpha).
#
# One extra row ('diagrams') owns the whole plugin: its Node half registers the
# four diagram tools, the two bundled skills, the per-conversation diagram
# store and the authenticated /api/dsh-diagrams/* routes (state, diagram
# read/write, content-addressed artifacts, export, the vendored Mermaid tree),
# and therefore ships its browser half (dsh.client) with the Loader entry.
#
# Nothing shipped is patched and no core row is disabled: this package adds
# surface - two tab types registered into the pack's own right bar (the
# `sidebarRightTabs` registry `dsh-rightbar` provides) and one keyed
# `tool.call.toolview` entry that renders a diagram inline in the conversation.
# There is therefore no `disabled: true` here and nothing for
# scripts/sync-vendored.ps1 to keep in sync (the vendored Mermaid engine is
# generated by packages/dsh-diagrams/vendor/build.mjs, not forked from core).
- insert:
    - id: diagrams
      name: 'dsh-diagrams'
