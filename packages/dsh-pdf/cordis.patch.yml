# dsh-pdf bundle layer (alpha).
#
# One extra row ('pdf') owns the whole plugin: its Node half registers the four
# PDF tools (pdf_info / pdf_read / pdf_find / pdf_render), the bundled
# pdf-analysis skill, the content-addressed artifact cache and the
# authenticated /api/dsh-pdf/* routes (state, the PDF bytes the tab reads, the
# vendored engine, and the extracted-page cache), and therefore ships its
# browser half (dsh.client) with the Loader entry.
#
# Nothing shipped is patched and no core row is disabled. The one surface this
# package SUPERSEDES it supersedes by REGISTRATION, not by disabling: for a
# `*.pdf` address the bar's tab registry ranks this package's `pdf` kind
# (band `extension`) above the shipped document preview's `text` type (band
# `fallback`), so a PDF opens in the real reader while every other file type
# keeps exactly the surface it had. The shipped preview's own PDF renderer
# stays mounted and remains the fallback for a profile without this package -
# the same way dsh-editor sits in front of the preview for text files.
#
# There is therefore no `disabled: true` here and nothing for
# scripts/sync-vendored.ps1 to keep in sync: the vendored pdf.js tree is
# generated by packages/dsh-pdf/vendor/build.mjs, not forked from core.
- insert:
    - id: pdf
      name: 'dsh-pdf'
